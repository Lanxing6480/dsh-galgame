<script>window.ExpressionLab = (() => {
/** Local expression director. No network, model, DOM, or session writes.
 * Feed ONLY the currently visible assistant text. Stable unitKey must survive
 * partial -> settled; use message identity + unit index, not partial/seq labels.
 */
                                                                                                              
                                                                                                        
                                                                                                          
                                     
                               
                          
                
                                
                   
                                             
 

                                                                                    
// Scores are heuristic weights, NOT probabilities. Each rule scores once.
const RULES                  = [
  // Explicit emotional/RP words remain a first-class route alongside work intent.
  { id: 'emotion-happy', portrait: 'happy', weight: 4, pattern: /开心|高兴|喜悦|欣喜/ },
  { id: 'emotion-shy', portrait: 'shy', weight: 4, pattern: /害羞|羞涩|脸红|不好意思/ },
  { id: 'emotion-angry', portrait: 'angry', weight: 4, pattern: /生气|恼火|不满|气鼓鼓/ },
  { id: 'emotion-sad', portrait: 'sad', weight: 4, pattern: /难过|失落|伤心|委屈|舍不得/ },
  { id: 'emotion-surprised', portrait: 'surprised', weight: 4, pattern: /惊讶|吃惊|惊喜/ },
  { id: 'emotion-helpless', portrait: 'helpless', weight: 4, pattern: /无奈|叹气/ },
  { id: 'emotion-thinking', portrait: 'thinking', weight: 4, pattern: /思索|沉思|琢磨/ },
  { id: 'surprise-exclamation', portrait: 'surprised', weight: 5, pattern: /呜哇|哇[啊呀哦]?|咦[？?！!]|诶[？?]/ },
  { id: 'unexpected-discovery', portrait: 'surprised', weight: 4, pattern: /(?:居然|竟然)(?:真)?(?:是|有|还|能)|没想到|原来如此[！!]/ },
  { id: 'happy-relief', portrait: 'happy', weight: 5, pattern: /太好了|终于(?:搞定|解决|完成|成功)了?|这下好了|搞定啦|好耶/ },
  { id: 'happy-laugh', portrait: 'happy', weight: 4, pattern: /嘿嘿|哈哈[哈！!～~]|开心地笑|忍不住笑/ },
  { id: 'verified-success', portrait: 'happy', weight: 4, pattern: /\d+\s*项(?:全部)?全绿|测试(?:全部|均|都)?通过|所有测试都通过/ },
  { id: 'consider-options', portrait: 'thinking', weight: 4, pattern: /让我(?:想想|想一想|琢磨一下)|我(?:再)?(?:想想|琢磨一下)|还需要(?:再)?确认|有两种可能/ },
  { id: 'consider-gesture', portrait: 'thinking', weight: 5, pattern: /托(?:着|住)?下巴|翻看(?:手里的)?本子/ },
  { id: 'resigned-phrase', portrait: 'helpless', weight: 5, pattern: /真拿.{0,6}没办法|只能这样了|只好这样了|偏偏又|还得再来一次/ },
  { id: 'resigned-gesture', portrait: 'helpless', weight: 5, pattern: /(?:摊开|摊了摊|摊摊)(?:双)?手|轻(?:轻)?叹(?:了)?(?:一口)?气|无奈地叹气/ },
  { id: 'avert-gaze', portrait: 'shy', weight: 4, pattern: /(?:心虚地?)?(?:移开|避开|挪开)(?:了)?(?:视线|目光)|心虚地?/ },
  { id: 'shy-praise', portrait: 'shy', weight: 5, pattern: /你(?:别|不要)(?:再)?这么夸我|(?:夸得|说得)我(?:有点)?不好意思|我有点(?:害羞|不好意思)/ },
  { id: 'shy-stammer', portrait: 'shy', weight: 4, pattern: /才[、，,]才没有|我[、，,]我才没/ },
  { id: 'shy-hesitation', portrait: 'shy', weight: 1, pattern: /那个[，,…]|这个嘛|咳[，,…]/ },
  { id: 'mild-displeasure', portrait: 'angry', weight: 5, pattern: /我(?:有点|真的|可)?(?:生气|不高兴)|气鼓鼓|轻哼(?:一声)?|哼[！!，,]/ },
  { id: 'quiet-sadness', portrait: 'sad', weight: 5, pattern: /我(?:有点|真的|还是)?(?:失落|难过|舍不得)|有点失落|垂下(?:了)?(?:眼睛|眼帘|眼眸)|失落地低下头/ },
]

const mask = (text        )         => text.replace(/[^\n]/g, ' ')

/** Preserve offsets while masking code, links, quotes and partial constructs.
 * Incomplete inline code/quotes stay masked: a streaming prefix must not act
 * on a quotation before the closing delimiter arrives.
 */
function expressionText(raw        )                                      {
  const ignored = new Set        ()
  let fence = ''
  let text = raw.split('\n').map((line) => {
    const start = /^\s*(`{3,}|~{3,})/.exec(line)
    if (fence) {
      if (start && start[1][0] === fence[0] && start[1].length >= fence.length) fence = ''
      ignored.add('代码块')
      return mask(line)
    }
    if (start) { fence = start[1]; ignored.add('代码块'); return mask(line) }
    if (/^\s*>|^\s*\|/.test(line)) { ignored.add('引用／表格'); return mask(line) }
    return line
  }).join('\n')
  const chars = text.split('')
  const pairs                         = { '“': '”', '「': '」', '『': '』', '"': '"', '‘': '’' }
  for (let i = 0; i < text.length; i++) {
    if (text[i] === '`') {
      let n = 1
      while (text[i + n] === '`') n++
      const end = text.indexOf('`'.repeat(n), i + n)
      const limit = end < 0 ? text.length : end + n
      for (let j = i; j < limit; j++) if (chars[j] !== '\n') chars[j] = ' '
      ignored.add('行内代码')
      i = limit - 1
    } else if (pairs[text[i]]) {
      const end = text.indexOf(pairs[text[i]], i + 1)
      const limit = end < 0 ? text.length : end + 1
      for (let j = i; j < limit; j++) if (chars[j] !== '\n') chars[j] = ' '
      ignored.add('引述内容')
      i = limit - 1
    }
  }
  text = chars.join('')
    .replace(/!?\[[^\]\n]*(?:\]\([^)]*(?:\)|$)|$)/g, (s) => { ignored.add('链接'); return mask(s) })
    .replace(/https?:\/\/[^\s）)]+|(?:[A-Za-z]:[\\/]|~\/)[^\s，。；]+/g, (s) => { ignored.add('地址／路径'); return mask(s) })
    .replace(/<[^>]*(?:>|$)|&(?:#x?[\da-f]+|\w+);/gi, mask)
    .replace(/[*_#]/g, ' ')
  return { text, ignored: [...ignored] }
}

function intentOf(text        , raw        )                   {
  if (/让我想|我琢磨|有两种可能|需要(?:再)?确认|权衡/.test(text)) return 'consider'
  if (/你(?:需要|要做)|接下来|运行以下|重启|操作步骤|先看报告|确认后/.test(text)) return 'instruct'
  if (/我改了什么|已完成|查完了|扫描结果|验证|测试|修复|新增|已打进|改为/.test(text)) return 'report'
  if (/根因|原因|因为|造成|所以|这意味着|说明|结论|契约|版本|接口|配置/.test(text)) return 'explain'
  if (!text.trim() && raw.trim() || /(?:^|\n)\s*(?:#{1,6}\s|[-*+]\s|\d+[.)]\s)|代码|日志|脚本|源码|字段/.test(raw)) return 'technical'
  return 'converse'
}

/** Classify already-visible text, with an explicit abstention result. */
function classifyExpression(raw        )                     {
  const { text, ignored } = expressionText(raw)
  const intent = intentOf(text, raw)
  const evidence                       = []
  const used = new Set        ()
  for (const clause of text.split(/(?<=[。！？!?；;\n])|——|……/)) {
    // Do not interpret descriptions about emotion labels or another actor.
    if (/表情|差分|关键词|字符串|字段|报错|示例|单元测试|匹配规则|检测规则/.test(clause)) {
      ignored.push('讨论表情／技术内容')
      continue
    }
    if (/(?:你|他|她|它|对方|用户|角色|小明|小红)(?:说|觉得|感到|有点|很|非常|十分|正在|生气|害羞|难过|开心|高兴|伤心|移开|心虚)|(?:让|使)(?:他|她|它|用户|对方)/.test(clause)) {
      ignored.push('其他主体的描述')
      continue
    }
    for (const rule of RULES) {
      if (used.has(rule.id)) continue
      const match = rule.pattern.exec(clause)
      if (!match) continue
      const before = clause.slice(0, match.index)
      const after = clause.slice(match.index + match[0].length)
      if (/(?:不|没|别|不要|不会|没有|并非|不是|不必|不该|不想|不再|不能|没必要)(?:让|让我|觉得|感到|显得|表现得|那么|太|很|再|真的|有点|这么|一点也)*$/.test(before)
        || /^(?:是|只是)?(?:假设|示例)|^(?:就|才|会)/.test(after)
        || /如果|假如|假设|要是/.test(before)) {
        ignored.push(`否定／条件语境：${match[0]}`)
        continue
      }
      used.add(rule.id)
      evidence.push({ rule: rule.id, portrait: rule.portrait, phrase: match[0], weight: rule.weight })
    }
  }
  const scores                                      = {}
  for (const hit of evidence) scores[hit.portrait] = (scores[hit.portrait] ?? 0) + hit.weight
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1])                          
  const best = sorted[0]
  if (best && best[1] >= 4 && best[1] - (sorted[1]?.[1] ?? 0) >= 2) {
    return { portrait: best[0], intent, reason: `语气命中：${evidence.filter(e => e.portrait === best[0]).map(e => e.phrase).join('、')}`, evidence, ignored: [...new Set(ignored)], scores }
  }
  if (best && best[1] >= 4) return { portrait: 'keep', intent, reason: '多个表情线索接近，保持', evidence, ignored: [...new Set(ignored)], scores }
  const work = ['explain', 'report', 'instruct', 'technical'].includes(intent)
  return { portrait: work ? 'neutral' : 'keep', intent, reason: work ? '普通工作表达，使用平静姿态' : '没有足够明确的语气，保持', evidence, ignored: [...new Set(ignored)], scores }
}

                                  
                        
                      
                          
                       
                    
                    
                              
 
                                   
                        
                                                                    
 
function initialExpressionState()                  {
  return { unitKey: null, portrait: 'neutral', emotionalSwitch: false, evaluatedText: '', completed: false, quietUnits: 0, decision: classifyExpression('') }
}

/** Pure reducer: never delay text; evaluate only completed clauses, or unit end.
 * At most one emotional switch per unit, plus a neutral reset on entering work.
 * Repeat delivery/partial settlement with identical key+text is idempotent.
 */
function advanceExpression(previous                 , input                                                             )                   {
  const entering = previous.unitKey !== input.unitKey
  let state = entering ? { ...previous, unitKey: input.unitKey, emotionalSwitch: false, evaluatedText: '', completed: false } : { ...previous }
  const masked = expressionText(input.visibleText).text
  let end = input.complete ? input.visibleText.length : 0
  if (!input.complete) {
    for (const m of masked.matchAll(/[。！？!?；;\n]|——|……/g)) end = (m.index ?? 0) + m[0].length
  }
  const ready = input.visibleText.slice(0, end)
  if ((!ready || ready === state.evaluatedText) && !(input.complete && !state.completed)) return { state, event: null }
  const decision = classifyExpression(ready)
  state = { ...state, decision, evaluatedText: ready }
  let target = decision.portrait
  if (input.complete && !state.completed) {
    state.completed = true
    state.quietUnits = target !== 'keep' && target !== 'neutral' ? 0 : state.quietUnits + 1
    if (target === 'keep' && !decision.evidence.length && state.quietUnits >= 2) {
      target = 'neutral'
      state.decision = { ...decision, reason: '连续两段没有情绪线索，回到平静' }
    }
  }
  if (target === 'keep' || target === state.portrait) return { state, event: null }
  if (state.emotionalSwitch) {
    state.decision = { ...decision, reason: '本段已经选定表情，保持至下一段' }
    return { state, event: null }
  }
  const from = state.portrait
  state.portrait = target
  if (target !== 'neutral') { state.emotionalSwitch = true; state.quietUnits = 0 }
  return { state, event: { from, to: target, reason: state.decision.reason } }
}

/**
 * dsh-galgame — 会话快照 → GalGame 台词脚本（纯函数，无副作用）。
 *
 * 职责：
 *  - 只保留 user / assistant 的**可见文本**（隐藏 tool-call、reasoning、image）；
 *  - 长文本自动分句（需求 9）；
 *  - 流式 partial 单独提供「进行中的台词」。
 */

             
                 
                   
                   
             
                   

/** 把 assistant blocks 里的可见文本拼出来（隐藏工具调用/思维链）。 */
function visibleTextOfBlocks(blocks                                       )         {
  if (blocks === undefined || blocks.length === 0) return ''
  const parts           = []
  for (const block of blocks) {
    if (block.kind !== 'text') continue
    const text = block.text ?? ''
    if (text.trim() !== '') parts.push(text)
  }
  return parts.join('\n')
}

/** 提取 assistant blocks 里的思维链文本（reasoning 块，用于思考气泡）。 */
function reasoningTextOfBlocks(blocks                                       )         {
  if (blocks === undefined || blocks.length === 0) return ''
  const parts           = []
  for (const block of blocks) {
    if (block.kind !== 'reasoning') continue
    const text = block.text ?? ''
    if (text.trim() !== '') parts.push(text)
  }
  return parts.join('\n')
}

/** 把 user content 里的文本拼出来（ContentBlock 兼容多种形态）。 */
function visibleTextOfContent(content                                                         )         {
  if (content === undefined || content.length === 0) return ''
  const parts           = []
  for (const block of content) {
    const text = block.text
    if (typeof text === 'string' && text.trim() !== '') parts.push(text)
  }
  return parts.join('\n')
}

/**
 * 分段器（按换行块拆分，用户建议）：
 * 输出「显示单元」列表，每个单元 = 一个换行块（空行分隔的段落）。
 *  - 表格 / 列表 / 引用 / 标题 / 代码块都在各自的块内，整块不切；
 *  - 不再按句子标点切分 —— 任何标点（表格里的 ！？… 等）都不会拆碎内容；
 *  - 代码块（``` / ~~~ 包裹）内的空行不分割。
 * 每个单元交给 MarkdownText 渲染；长块由对话框滚动显示。
 */
function splitIntoSentences(text        )                    {
  const normalized = text.replace(/\r\n/g, '\n').trim()
  if (normalized === '') return []
  const blocks           = []
  let current = ''
  let inCodeFence = false
  for (const line of normalized.split('\n')) {
    if (/^\s*(```|~~~)/.test(line)) inCodeFence = !inCodeFence
    const isEmpty = line.trim() === ''
    if (isEmpty && !inCodeFence) {
      if (current.trim() !== '') {
        blocks.push(current.trim())
        current = ''
      }
    } else {
      current += (current === '' ? '' : '\n') + line
    }
  }
  if (current.trim() !== '') blocks.push(current.trim())
  return mergeLeadingListGuides(blocks)
}

/** 列表项单元判定。 */
function isListUnit(text        )          {
  return /^\s*([-*+]|\d+[.)])\s+/.test(text)
}

/** 是否以句末标点收尾（完整句子的标志）。 */
function endsWithSentenceEnd(text        )          {
  return /[。！？!?…～~]$/.test(text)
}

/**
 * 合并「列表引导句」：若一个单元不以句末标点收尾（标题行、冒号结尾的
 * 引导句，如「已完成的修复」「实现步骤：」），且下一单元是列表块，
 * 就把两者合并为一个单元 —— 避免标题/排头与列表被拆开显示（问题 5）。
 */
function mergeLeadingListGuides(units                   )           {
  const merged           = []
  for (const unit of units) {
    const last = merged[merged.length - 1]
    if (last !== undefined && isListUnit(unit) && !endsWithSentenceEnd(last) && !isListUnit(last)) {
      merged[merged.length - 1] = `${last}\n${unit}`
    } else {
      merged.push(unit)
    }
  }
  return merged
}

/** 单个节点 → 台词行（无可见文本则返回 null）。 */
function lineFromNode(node                  )                    {
  if (node.kind === 'user') {
    const text = visibleTextOfContent(node.content)
    if (text === '') return null
    return {
      key: `user-${node.seq}`,
      playbackKey: `user-${node.seq}`,
      seq: node.seq,
      speaker: 'user',
      name: '我',
      text,
      portrait: 'neutral',
      time: node.time ?? 0,
      // 用户输入整段显示，不分段（问题 3：不用切段）。
      sentences: [text],
    }
  }
  if (node.kind === 'assistant') {
    const text = visibleTextOfBlocks(node.blocks)
    if (text === '') return null
    const reasoning = reasoningTextOfBlocks(node.blocks)
    return {
      key: `assistant-${node.seq}`,
      playbackKey: typeof node.turn === 'number' && typeof node.step === 'number'
        ? `assistant-${node.turn}-${node.step}` : `assistant-${node.seq}`,
      seq: node.seq,
      speaker: 'assistant',
      name: '鲸鱼娘',
      text,
      portrait: 'neutral',
      time: node.time ?? 0,
      sentences: splitIntoSentences(text),
      ...(reasoning === '' ? {} : { reasoning }),
    }
  }
  // steering / context / tool-result / command / compaction / ... 第一版不进入台词
  return null
}

/** 全量节点 → 台词脚本。 */
function buildScript(nodes                             )                        {
  const lines               = []
  for (const node of nodes) {
    const line = lineFromNode(node)
    if (line !== null) lines.push(line)
  }
  return lines
}

/**
 * 流式 partial → 「进行中的台词」行。
 * 无任何输出（text 与 reasoning 皆空）返回 null；
 * 只有思维链（text 空、reasoning 有）也返回行 —— 流式早期模型先思考后
 * 输出正文时，思考气泡能实时显示流式思维过程（问题 2 修复）。
 */
function partialLine(partial                         )                    {
  if (partial === null) return null
  const text = visibleTextOfBlocks(partial.blocks)
  const reasoning = reasoningTextOfBlocks(partial.blocks)
  if (text === '' && reasoning === '') return null
  return {
    key: `partial-${partial.turn}-${partial.step}`,
    playbackKey: `assistant-${partial.turn}-${partial.step}`,
    seq: Number.MAX_SAFE_INTEGER - partial.turn,
    speaker: 'assistant',
    name: '鲸鱼娘',
    text,
    portrait: 'neutral',
    time: Date.now(),
    sentences: splitIntoSentences(text),
    ...(reasoning === '' ? {} : { reasoning }),
  }
}

/** 快照字段 → { 已定稿台词, 流式台词 }。 */
function snapshotToScript(
  nodes                             ,
  partial                         ,
)   
                                
                              
  {
  return {
    settled: buildScript(nodes),
    streaming: partialLine(partial),
  }
}

return { splitIntoSentences, classifyExpression, initialExpressionState, advanceExpression };
})();</script>
<script>const ORIGINAL_SAMPLE = "呜哇——查完了，真的是三处同时断，而且都是「版本迭代把旧接缝改没了」造成的。逐条说结论：\n\n## 三个根因（都有源码/日志证据）\n\n**① 模式消失** — 0.2.0 的 `dsh-agent-preset-registry` **不再扫** `$DSH_HOME/.agent-presets/` 目录，官方 skill 原话是 *\"Nothing reads that directory any more\"*。你机器上 `~/.dsh/.agent-presets/roleplay/` 还在（说明插件跑过、也写了），但组装出来的 `cordis.yml` 里只有 `preset-standard/ptc/minimal/cordis`，**没有&#x20;****`preset-roleplay`** —— 所以选择器里没有它。顺带发现旧模板的 `dsh-persona` 用的是 0.1.x 的 `text:` 字段，新版的配置是 `prefix(必填)/complete`，就算目录被读也会激活失败。\n\n**② 注入链路失效** — 插件检测 `dsh-agent-loop` 补丁，找不到就 `return next()`，结果**一行都不注入**（注释还写着\"退化为只注入 user 段\"，和代码不符）。而且 0.2.0 收紧了契约：`PreStepDecision.messages` 只能是 `UserMessage[]`；`assistant/message` 必须带 `stream` 结算数组。旧补丁那套写法在新版本身也不成立。\n\n**③ 历史会话打不开** — 旧补丁切步之后，`turn()` 的 finally 仍用切步**前**的编号写 `step/end`，日志里留下 `step/start {turn:1,step:8}` → `step/end {turn:1,step:1}`。0.1.x 不校验所以当年能开；0.2.0 的 v0→v4 迁移逐事件校验，直接抛 `step/end does not match an open turn and step`。\n\n## 我改了什么\n\n- **DSH 本体补丁已打进你本机**（`scripts/patch-dsh-agent-loop.mjs`，三处手术：按角色分流写入 + `patchBreaks` 切步、`step` 改为可推进的 `let`、finally 用推进后的编号）。幂等、`--check`/`--revert`、语法自检、自动备份，`--revert` 能字节级还原（已验证）。升级 dsh 后双击 `scripts/repatch-after-update.bat` 重打。\n- **模式改为静态声明**：`cordis.patch.yml` 里插入 `preset-roleplay`，`plugins` 逐行抄自同版本官方 standard（只把 persona 换成\"中性外壳 + `complete: true`\"）。真 Profile 组装已验证出现该行。旧的文件式安装代码（`ensurePresetMode`/`writePresetPersona`）删除。\n- **注入引擎重写**：有补丁 → 全量拟造序列（一次请求、顺序完美、心声照旧是 reasoning 块）；没补丁 → **降级**为单块上下文而不是什么都不做。\n- **新增三个运维脚本**：`check-preset-drift.mjs`（模式漂移检查）、`regenerate-preset-patch.mjs`（升级后重新抄）、`repair-roleplay-sessions.mjs`（旧会话修复，**默认 dry-run**）。\n- 测试套件重写：`npm test` → **5 套 / 59 项全绿**；e2e 把产物日志交给 `Session.fromRestore()`（和\"打开/迁移会话\"同一个校验器），并覆盖降级路径与\"别的模式一个字都不注入\"。\n\n## 你要做的两件事\n\n1. **完全退出并重启 dsh**（补丁要重启才生效，模式会随之出现在选择器里）。\n2. **修旧会话**（按你说的，我没代跑）：\n```powershell\ncd H:\\Projects\\DeepSeekHarnessPlugin\\plugins\\dsh-roleplay\nnode scripts/repair-roleplay-sessions.mjs            # 先看报告\nnode scripts/repair-roleplay-sessions.mjs --apply    # 确认后真修，自动备份\n```\n\n扫描结果：**11 个可修**（含全部 4 个 roleplay 会话 + 同批注入过的 standard/deepseek-girl 父会话与分叉），**14 个修不了**（0.1.x 其它历史形态：缺 `id`、`unclassified message source`、descriptor 版本等，脚本只报告不动）。\n\n另外两件小事：`~/.dsh/.agent-presets/roleplay/` 现在没人读了，删不删都行（里面可能是你改过的组装）；`dsh --dump-config` 时还看到两条无关噪声——你的 profile patch 里 `ui-dsh-aionui-panel` 和 home patch 里的 `wsl` 都指向已不存在的行，要不要清我下次一起处理。\n\n细节都在 [修复报告](H:\\Projects\\DeepSeekHarnessPlugin\\docs\\dsh-roleplay-0.2-修复报告.md) 和 [README](H:\\Projects\\DeepSeekHarnessPlugin\\plugins\\dsh-roleplay\\README.md) 里；脚本在 [scripts/](H:\\Projects\\DeepSeekHarnessPlugin\\plugins\\dsh-roleplay\\scripts\\run-tests.mjs)。\n";</script>
<script>/* Standalone experiment UI. The builder embeds the actual TS classifier and
 * adapter; no CDN, fetch, framework, API key, or model runtime. */
(() => {
  const { splitIntoSentences, initialExpressionState, advanceExpression } = window.ExpressionLab
  const $ = (id) => document.getElementById(id)
  const labels = { neutral: '平静', happy: '开心', thinking: '思考', surprised: '惊讶', helpless: '无奈', angry: '轻微不满', sad: '难过', shy: '目移／害羞' }
  const intents = { explain: '解释原因', report: '汇报结果', instruct: '交代操作', consider: '思索／权衡', technical: '技术内容', converse: '一般表达' }
  const root = '../../assets/characters/deepseek/'
  const assets = Object.fromEntries(Object.keys(labels).map(id => [id, id === 'happy' ? root + 'portraits/neutral.webp' : root + 'portraits/expressions-v1/' + id + '.webp']))
  let source = ORIGINAL_SAMPLE
  let units = splitIntoSentences(source)
  let unitIndex = 0, visible = 0, playing = false, timer = null
  let state = initialExpressionState(), events = [], lastImage = '', imageVersion = 0, activeImage = 0
  let lastVisibleText = '', lastHistory = ''
  const imageNodes = [$('portrait-a'), $('portrait-b')]
  imageNodes[0].src = assets.neutral
  Object.values(assets).forEach(src => { const img = new Image(); img.src = src })

  // A small safe Markdown view for this experiment. All user text is inserted
  // as text nodes; no raw HTML or links from pasted input are executed.
  function inline(parent, text) {
    const pattern = /(`[^`]+`|\*\*[^*]+\*\*)/g
    let cursor = 0
    for (const match of text.matchAll(pattern)) {
      parent.append(document.createTextNode(text.slice(cursor, match.index)))
      const el = document.createElement(match[0].startsWith('`') ? 'code' : 'strong')
      el.textContent = match[0].startsWith('`') ? match[0].slice(1, -1) : match[0].slice(2, -2)
      parent.append(el)
      cursor = match.index + match[0].length
    }
    parent.append(document.createTextNode(text.slice(cursor)))
  }
  function markdown(text) {
    const frag = document.createDocumentFragment()
    let code = null
    for (const line of text.split('\n')) {
      if (/^\s*(```|~~~)/.test(line)) {
        if (code) code = null
        else { const pre = document.createElement('pre'); code = document.createElement('code'); pre.append(code); frag.append(pre) }
        continue
      }
      if (code) { code.append(document.createTextNode(line + '\n')); continue }
      const heading = /^#{1,6}\s+/.test(line)
      const el = document.createElement(heading ? 'h3' : /^\s*>/.test(line) ? 'blockquote' : 'p')
      if (/^\s*([-*+]\s|\d+[.)]\s)/.test(line)) el.className = 'list'
      inline(el, line.replace(/^#{1,6}\s+|^\s*>\s?/, '').replace(/&#x20;/gi, ' '))
      frag.append(el)
    }
    return frag
  }
  function feed(index, count) {
    const result = advanceExpression(state, { unitKey: `preview:${index}`, visibleText: units[index].slice(0, count), complete: count === units[index].length })
    state = result.state
    if (result.event) events.push({ unit: index + 1, offset: count, ...result.event })
  }
  function simulate(index, count) {
    // Evaluate at the same punctuation boundaries used in streaming, never at
    // the full future paragraph. This makes manual navigation reproducible.
    const text = units[index].slice(0, count)
    let last = 0
    for (const m of text.matchAll(/[。！？!?；;\n]|——|……/g)) {
      last = m.index + m[0].length
      feed(index, last)
    }
    if (last !== count || count === units[index].length) feed(index, count)
  }
  function seek(index, count = units[index]?.length ?? 0) {
    pause()
    unitIndex = Math.max(0, Math.min(index, units.length - 1))
    visible = count
    state = initialExpressionState(); events = []
    for (let i = 0; i < unitIndex; i++) simulate(i, units[i].length)
    simulate(unitIndex, visible)
    render()
  }
  function portrait(id) {
    if (id === lastImage) return
    lastImage = id
    $('portrait-label').textContent = labels[id]
    const version = ++imageVersion
    const nextIndex = 1 - activeImage
    const next = imageNodes[nextIndex]
    next.onload = () => {
      if (version !== imageVersion) return
      imageNodes[activeImage].classList.remove('visible')
      imageNodes[activeImage].setAttribute('aria-hidden', 'true')
      next.classList.add('visible'); next.removeAttribute('aria-hidden')
      activeImage = nextIndex
    }
    next.onerror = () => { if (version === imageVersion) $('status').textContent = `未能加载 ${labels[id]} 图片，请检查候选素材目录。` }
    next.alt = `鲸鱼娘 · ${labels[id]}`
    next.src = assets[id]
  }
  function render() {
    const text = units[unitIndex]?.slice(0, visible) ?? ''
    if (text !== lastVisibleText) {
      const scroller = $('dialogue')
      const follow = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 50
      scroller.replaceChildren(markdown(text || '点击播放，查看表情如何跟随文字变化。'))
      if (follow) scroller.scrollTop = scroller.scrollHeight
      lastVisibleText = text
    }
    portrait(state.portrait)
    $('position').textContent = `${visible} / ${units[unitIndex]?.length ?? 0} 字`
    $('unit-count').textContent = `${unitIndex + 1} / ${units.length}`
    $('switch-count').textContent = String(events.length)
    $('progress').max = units[unitIndex]?.length || 1
    $('progress').value = visible
    $('intent').textContent = `表达功能 · ${intents[state.decision.intent]}`
    $('decision').textContent = labels[state.portrait]
    $('reason').textContent = state.evaluatedText ? state.decision.reason : '等待当前可见短句形成；文字继续显示，立绘保持。'
    $('evidence').textContent = state.decision.evidence.length ? state.decision.evidence.map(e => `${labels[e.portrait]} +${e.weight}  「${e.phrase}」`).join('\n') : '没有足够的情绪证据，不强行换脸。'
    $('ignored').replaceChildren(...state.decision.ignored.map(s => { const span = document.createElement('span'); span.textContent = s; return span }))
    const historySignature = JSON.stringify(events)
    if (historySignature !== lastHistory) {
      lastHistory = historySignature
      $('history').replaceChildren(...events.map(e => {
        const li = document.createElement('li'), button = document.createElement('button'), small = document.createElement('small')
        button.className = 'timeline-button'
        button.textContent = `第 ${e.unit} 段 · ${labels[e.from]} → ${labels[e.to]}`
        button.onclick = () => seek(e.unit - 1, e.offset)
        small.textContent = `第 ${e.offset} 字 · ${e.reason}`
        li.append(button, small); return li
      }))
      if (!events.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = '还没有发生切换'; $('history').append(li) }
    }
    $('prev').disabled = unitIndex === 0
    $('next').disabled = unitIndex === units.length - 1
    $('play').textContent = playing ? '暂停' : '播放'
    $('reveal').disabled = visible === (units[unitIndex]?.length ?? 0)
  }
  function pause() { playing = false; clearTimeout(timer); timer = null }
  function tick() {
    if (!playing) return
    const length = units[unitIndex].length
    if (visible === length) {
      if (unitIndex === units.length - 1) { pause(); render(); return }
      unitIndex++; visible = 0
    }
    const target = Math.min(units[unitIndex].length, visible + Math.max(1, Math.round(Number($('speed').value) / 20)))
    // Keep decision offsets independent of playback speed/chunk size.
    for (let n = visible + 1; n <= target; n++) feed(unitIndex, n)
    visible = target
    render()
    timer = setTimeout(tick, visible === units[unitIndex].length ? 1100 : 50)
  }
  function play() { if (playing) return; playing = true; render(); timer = setTimeout(tick, 50) }
  function load(text) {
    const next = splitIntoSentences(text)
    if (!next.length) { $('status').textContent = '请先输入一段回复。'; return }
    if (text.length > 12000) { $('status').textContent = '试验页每次最多 12000 字，请选取一条回复。'; return }
    pause(); source = text; units = next; $('source').value = text; $('status').textContent = ''; seek(0, 0)
  }
  $('play').onclick = () => { if (playing) { pause(); render() } else { if (unitIndex === units.length - 1 && visible === units[unitIndex].length) seek(0, 0); play() } }
  $('restart').onclick = () => { seek(0, 0); play() }
  $('prev').onclick = () => seek(unitIndex - 1)
  $('next').onclick = () => seek(unitIndex + 1)
  $('reveal').onclick = () => seek(unitIndex)
  $('background').onclick = () => $('stage').classList.toggle('light')
  $('apply').onclick = () => { load($('source').value); if ($('source').value.trim() && !$('status').textContent) play() }
  $('original').onclick = () => { load(ORIGINAL_SAMPLE); seek(0) }
  $('edge-cases').onclick = () => {
    load('日志显示迁移失败，历史会话打不开，14 个修不了。\n\n害羞表情的实现步骤如下。\n\n她说：“我有点生气！”\n\n我没有生气。\n\n（移开视线）那个……不是我吃的。\n\n你别这么夸我。\n\n根因是接口版本变化。\n\n终于解决了！\n\n让我想想，有两种可能。\n\n（摊开双手）真拿你没办法。\n\n我有点生气。\n\n我有点失落。')
    play()
  }
  $('export').onclick = () => {
    const blob = new Blob([JSON.stringify({ schema: 1, source, unitIndex, visible, events, current: state }, null, 2)], { type: 'application/json' })
    const url = URL.createObjectURL(blob), a = document.createElement('a')
    a.href = url; a.download = 'expression-replay.json'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000)
  }
  window.addEventListener('pagehide', pause)
  load(source)
  seek(0)
})()
</script>
