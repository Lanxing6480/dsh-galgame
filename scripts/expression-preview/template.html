<style>
*{box-sizing:border-box}body{margin:0;background:#101a2b;color:#edf3fc;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,select,textarea{font:inherit}button,select{border:1px solid #536783;border-radius:9px;padding:8px 13px;background:#263b57;color:#f1f6ff;cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary{background:#a3dbe1;color:#102832;border-color:#a3dbe1;font-weight:650}button:hover:not(:disabled){filter:brightness(1.12)}a{color:#a3dbe1}h1{font-size:24px;margin:0}h2{font-size:15px;margin:0 0 12px}.page{max-width:1460px;margin:auto;padding:22px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.muted{color:#a5b7ce}.eyebrow{font-size:11px;letter-spacing:2px;color:#a3dbe1}.badge{border:1px solid #3c6d71;background:#203d43;padding:6px 11px;border-radius:20px;color:#bfe9df;font-size:12px;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(320px,1fr);gap:18px}.left,.panel{border:1px solid #32435c;border-radius:15px;overflow:hidden;background:#17243a}.stage{height:clamp(370px,62vh,680px);position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#425c78,#1c2b42 70%)}.stage.light{background:radial-gradient(ellipse at 50% 30%,#fcfaf4,#cdd5e0)}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;opacity:0;transition:opacity 160ms ease;pointer-events:none}.stage img.visible{opacity:1}.caption{position:absolute;top:16px;left:16px;border-radius:20px;background:#101d30db;padding:6px 12px;color:#deedf9;z-index:2}.background{position:absolute;top:14px;right:14px;z-index:3;font-size:12px}.dialogue{padding:16px 22px;background:#152238;border-top:1px solid #3a506d;min-height:190px}.speaker{color:#a3dbe1;font-weight:650;display:flex;justify-content:space-between;margin-bottom:9px}.speaker small{font-weight:400;color:#b1bfd3}.text{height:168px;overflow:auto;overflow-wrap:anywhere;font-size:15px;line-height:1.8}.text p{margin:0 0 7px}.text h3{font-size:17px;margin:4px 0 10px}.text pre{background:#0d1625;padding:12px;border-radius:7px;overflow:auto;white-space:pre-wrap}.text code{background:#ffffff10;padding:1px 4px;border-radius:4px}.text pre code{background:none;padding:0}.text .list{padding-left:12px}.text blockquote{margin:3px 0;padding-left:12px;border-left:2px solid #637d98;color:#b3c1d4}.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:14px;background:#1c2d46}.controls select{max-width:145px}.panel{padding:18px;margin-bottom:14px}.decision{font-size:22px;margin:4px 0 8px;color:#b9e7e5}.metrics{display:flex;gap:18px;border-bottom:1px solid #35445b;padding-bottom:14px;margin-bottom:14px}.metrics strong{font-size:21px;display:block}.metrics small{color:#a5b7ce}.reason{margin:10px 0;min-height:45px}.evidence{font-size:13px;padding:10px;background:#0e192b;border-radius:8px;color:#bfccdf;white-space:pre-wrap}.history{max-height:210px;overflow:auto;padding-left:21px;margin:0}.history li{padding-bottom:12px}.history small{display:block;color:#a5b7ce}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chips span{background:#253a53;padding:3px 8px;border-radius:12px;color:#b9ccdf;font-size:12px}.editor{margin-top:18px}.editor summary{cursor:pointer;font-weight:600}.editor p{color:#a5b7ce}textarea{width:100%;height:240px;background:#0d192a;color:#e9f1fb;border:1px solid #526782;border-radius:8px;padding:14px;resize:vertical}.editor .buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.foot{color:#92a8c3;font-size:12px;margin:12px 0 0}.status{min-height:20px;color:#eac788;font-size:12px}.source-button{color:#b9ccdf;background:transparent}.timeline-button{padding:0;border:0;background:none;color:#bfe4ec;text-align:left}.intent{color:#b4c8e0}progress{width:100%;height:4px;accent-color:#a3dbe1;display:block}.pill{font-size:12px;color:#bccbde}.empty{color:#7e94ae}.rule-note{font-size:12px;color:#9db0c8;margin- <body><div class="page">
<div class="top"><div><div class="eyebrow">LOCAL EXPRESSION LAB · 01</div><h1>大肥鱼 · 本地表情试演</h1><div class="muted">按原插件分段，让表情跟着当前可见文字走。</div></div><span class="badge">本地规则 · 无模型请求</span></div>
<div class="layout"><section class="left" aria-label="演出预览">
<div class="stage" id="stage"><span class="caption" id="portrait-label">平静</span><button class="background" id="background">切换背景</button><img id="portrait-a" class="visible" alt="鲸鱼娘 · 平静"><img id="portrait-b" alt="" aria-hidden="true"></div>
<div class="dialogue"><div class="speaker">鲸鱼娘 <small id="position"></small></div><div id="dialogue" class="text" aria-label="当前显示的文字"></div></div>
<progress id="progress" value="0" max="1" aria-label="当前段落进度"></progress>
<div class="controls"><button id="play" class="primary">播放</button><button id="restart">从头播放</button><button id="prev">上一段</button><button id="next">下一段</button><button id="reveal">显示本段全文</button><select id="speed" aria-label="显示速度"><option value="35">慢速 · 35 字/秒</option><option value="100" selected>正常 · 100 字/秒</option><option value="250">快速 · 250 字/秒</option></select></div>
</section><aside>
<section class="panel"><h2>当前判定</h2><div class="metrics"><div><strong id="unit-count">0 / 0</strong><small>显示段落</small></div><div><strong id="switch-count">0</strong><small>已发生切换</small></div><div><strong>0</strong><small>API 调用</small></div></div><div class="intent" id="intent"></div><div class="decision" id="decision"></div><div class="reason" id="reason"></div><div class="evidence" id="evidence"></div><div class="chips" id="ignored"></div><p class="rule-note">分数是规则权重，不是概率。每段最多一次情绪切换；普通工作表达可先回到平静。</p></section>
<section class="panel"><h2>实际切换轨迹</h2><ol class="history" id="history"></ol><p class="foot">点击记录定位到切换发生的文字位置。</p></section>
<div class="status" id="status" role="status"></div>
</aside></div>
<details class="panel editor"><summary>换一段真实回复试试</summary><p>内置的是你提供的修复汇报。也可以粘贴其他回复，观察是否误判。输入只在此页面内使用。</p><textarea id="source" maxlength="12000" aria-label="待试演的回复"></textarea><div class="buttons"><button id="apply" class="primary">应用并从头播放</button><button id="original">恢复原文</button><button id="edge-cases">试试反例与语气对照</button><button id="export" class="source-button">下载本次判定记录</button></div></details>
<p class="foot">独立试演页，与正式 GalGame 共用本地表情规则。工具执行专用差分尚未制作。<a href="README.md">试验说明</a></p>
</div>
